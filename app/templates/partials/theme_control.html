<div class="drawer__theme-switch" data-theme-toggle>
  <span class="drawer__theme-title">Aparência</span>
  <div class="drawer__theme-pill" role="group" aria-label="Alternar tema">
    <button type="button" class="drawer__theme-btn" data-theme-option="light" aria-pressed="false">
      <span class="drawer__theme-icon">☀</span>
      <span class="drawer__theme-text">Claro</span>
    </button>
    <button type="button" class="drawer__theme-btn" data-theme-option="dark" aria-pressed="false">
      <span class="drawer__theme-icon">☾</span>
      <span class="drawer__theme-text">Escuro</span>
    </button>
    <span class="drawer__theme-thumb" aria-hidden="true"></span>
  </div>
</div>
