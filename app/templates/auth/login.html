{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block body %}
<div class="login-page">
  <div class="login-brand">
    <img src="{{ url_for('static', filename='images/logo2.webp') }}" alt="Construtora Sousa Araujo" class="login-brand__logo" />
  </div>

  <div class="login-card">
    <div class="login-card__header">
      <h1 class="login-card__title">Login</h1>
    </div>

    {% if erro %}
    <div class="alert alert--error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ erro }}
    </div>
    {% endif %}

    <form method="POST" class="login-form" novalidate>
      <div class="field">
        <label class="field__label login-field__label" for="email">E-mail corporativo</label>
        <input
          class="field__input login-field__input"
          type="email"
          id="email"
          name="email"
          placeholder="nome@sousaaraujo.com.br"
          autocomplete="email"
          required
        />
      </div>
      <div class="field">
        <label class="field__label login-field__label" for="senha">Senha</label>
        <div class="field__password-wrap login-field__password-wrap">
          <input
            class="field__input login-field__input"
            type="password"
            id="senha"
            name="senha"
            placeholder="********"
            autocomplete="current-password"
            required
          />
          <button type="button" class="field__eye" aria-label="Mostrar senha" onclick="toggleSenha()">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn--primary btn--full login-card__submit">Entrar</button>
    </form>

    <p class="login-card__domain-note">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Apenas e-mails @sousaaraujo.com.br são permitidos
    </p>
  </div>

  <div class="login-page__bg">
    <div class="login-page__bg-shape login-page__bg-shape--1"></div>
    <div class="login-page__bg-shape login-page__bg-shape--2"></div>
  </div>
</div>

<script>
function toggleSenha() {
  const input = document.getElementById('senha');
  input.type = input.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
