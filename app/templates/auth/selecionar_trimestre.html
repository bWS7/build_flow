{% extends "base.html" %}
{% block title %}Selecionar Trimestre{% endblock %}

{% block body %}
<div class="quarter-page">
  <div class="quarter-page__bg">
    <div class="quarter-page__bg-shape quarter-page__bg-shape--1"></div>
    <div class="quarter-page__bg-shape quarter-page__bg-shape--2"></div>
  </div>

  <div class="quarter-shell">
    <img src="{{ url_for('static', filename='images/logo2.png') }}" alt="Build Flow" class="quarter-shell__logo" />

    <header class="quarter-shell__header">
      <h1 class="quarter-shell__title">Selecione o Período</h1>
      <p class="quarter-shell__subtitle">
        Olá, <strong>{{ current_user.nome }}</strong>. Escolha o trimestre em que deseja trabalhar.
      </p>
    </header>

    <form method="POST" id="select-trimestre-form" class="quarter-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <input type="hidden" name="trimestre" id="selected-trimestre" value="" />

      <div class="quarter-grid">
        <!-- Q1 -->
        <button type="button" class="quarter-card" onclick="selectQuarter('q1')">
          <span class="quarter-card__badge quarter-card__badge--q1">Q1</span>
          <span class="quarter-card__name">1º Trimestre</span>
          <span class="quarter-card__period">Abril a Junho</span>
          <span class="quarter-card__tag quarter-card__tag--neutral">Dados consolidados</span>
        </button>

        <!-- Q2 -->
        <button type="button" class="quarter-card" onclick="selectQuarter('q2')">
          <span class="quarter-card__badge quarter-card__badge--q2">Q2</span>
          <span class="quarter-card__name">2º Trimestre</span>
          <span class="quarter-card__period">Julho a Setembro</span>
          <span class="quarter-card__tag quarter-card__tag--current">Trimestre atual</span>
        </button>
      </div>
    </form>
  </div>
</div>

<script>
function selectQuarter(q) {
  document.getElementById('selected-trimestre').value = q;
  document.getElementById('select-trimestre-form').submit();
}
</script>
{% endblock %}
