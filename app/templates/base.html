<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token() }}" />
  <title>Construtora Sousa Araújo - INPUT</title>
  <script>
    (function () {
      const stored = localStorage.getItem('dash-theme');
      const theme = stored === 'dark' || stored === 'light' ? stored : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/webp" href="{{ url_for('static', filename='images/logo.webp') }}" />
  <link rel="shortcut icon" type="image/webp" href="{{ url_for('static', filename='images/logo.webp') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
  {% block extra_css %}{% endblock %}
</head>
<body>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-container">
      {% for cat, msg in messages %}
        <div class="flash flash--{{ cat }}">{{ msg }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

{% block body %}{% endblock %}

<script>
window.APP_CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]')?.content || '';
(function () {
  const storageKey = 'dash-theme';

  function applyTheme(theme) {
    const normalized = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', normalized);

    document.querySelectorAll('[data-theme-toggle]').forEach((toggle) => {
      toggle.dataset.theme = normalized;

      toggle.querySelectorAll('[data-theme-option]').forEach((button) => {
        const active = button.dataset.themeOption === normalized;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    });
  }

  const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(currentTheme);

  document.querySelectorAll('[data-theme-option]').forEach((button) => {
    button.addEventListener('click', () => {
      const nextTheme = button.dataset.themeOption === 'dark' ? 'dark' : 'light';
      localStorage.setItem(storageKey, nextTheme);
      applyTheme(nextTheme);
    });
  });
})();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
